name: CI

on:
  push:
  pull_request:

jobs:
  codestyle:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --locked --extra testing

      - name: Check formatting
        run: uv run ruff format --check --diff .

      - name: Check lint rules
        run: uv run ruff check --output-format=github .

  tests:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write  # for the coverage comment
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --locked --extra testing

      - name: Run tests
        run: make coverage ARGS="--cov-report=term --cov-report=xml"

      - name: Comment coverage on pull request
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: coverage.xml

      - name: Upload results to Codecov
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: deluge/ai-usage-monitor

  # The tests run with CPython; this catches code that MicroPython can't compile.
  esp32:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --locked --extra testing

      - name: Compile the ESP32 code
        run: make esp32
