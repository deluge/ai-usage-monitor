name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Check formatting
        run: uvx ruff@0.17.3 format --check --diff .

      - name: Check lint rules
        run: uvx ruff@0.17.3 check --output-format=github .
