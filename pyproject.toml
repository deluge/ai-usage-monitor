[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["display_usage*"]

[project]
name = "ai-usage-monitor"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
testing = [
	"freezegun>=1.5.5,<1.6",
	"luma.oled>=3.16,<3.17",
	"mpy-cross>=1.29,<1.30",  # compiles the ESP32 code (make esp32), same version as the firmware
	"Pillow>=13,<13.1",
	"pytest>=9.2,<9.3",
	"pytest-cov>=7.1.0,<7.2",
	"requests>=2.34,<2.35",
	"ruff>=0.17.3",
]
develop = [
	"ai-usage-monitor[testing]",
	"ipdb>=0.13.13,<0.14",
]

[tool.pytest.ini_options]
addopts = "--verbose --tb=short -p no:doctest"

testpaths = [
	"testing/",
]

python_files = [
	"test_*.py",
]

[tool.ruff]
line-length = 96
target-version = "py313"
exclude = [
	".venv",
]

[tool.ruff.lint]
select = [
	"E",   # pycodestyle errors
	"W",   # pycodestyle warnings
	"F",   # Pyflakes
	"I",   # isort
	"UP",  # pyupgrade
	"TID", # flake8-tidy-imports
]

[tool.ruff.lint.isort]
known-first-party = ["display_usage"]
lines-after-imports = 2

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.coverage.run]
branch = true
source = [
	"display_usage",
]

omit = [
	"*/__init__.py",
	"display_usage/esp32/dejavu_sans_*.py",  # generated font data
]

[tool.coverage.report]
exclude_lines = [
	"raise NotImplementedError",
	"except ImportError:",  # fallbacks for MicroPython
]
